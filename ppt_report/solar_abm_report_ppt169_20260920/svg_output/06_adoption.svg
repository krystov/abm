<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Segoe UI, system-ui, sans-serif">

  <rect id="page-bg" data-pptx-role="background"
        x="0" y="0" width="1280" height="720" fill="#F7F5F0"/>

  <g id="page-header" data-pptx-bounds="72 48 1136 132">
    <rect id="motif-bar" x="72" y="58" width="56" height="4" fill="#C0562B"/>
    <text x="72" y="96" font-size="18" fill="#16233A" fill-opacity="0.78">PART 2 · 复现的三个核心机制</text>
    <text x="72" y="142" font-size="42" font-weight="700" fill="#16233A">采用不是一次判断，而是两阶段</text>
    <line x1="72" y1="168" x2="1208" y2="168" stroke="#16233A" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <g id="stage-ideation" data-pptx-bounds="72 200 1136 212">
    <text x="72" y="228" font-size="18" font-weight="700" fill="#C0562B">阶段一 · 萌生念头（Eq. 2）</text>
    <text x="72" y="294" font-family="Consolas, Microsoft YaHei, monospace" font-size="32" font-weight="700" fill="#16233A">0.19·PE + 0.17·IN + 0.52·AW + 0.12·IRR  &gt;  0.5</text>
    <line x1="72" y1="330" x2="700" y2="330" stroke="#16233A" stroke-opacity="0.25" stroke-width="1"/>
    <rect x="384" y="322" width="3" height="16" fill="#C0562B"/>
    <text x="385" y="364" font-size="18" fill="#C0562B" text-anchor="middle">阈值 0.5</text>
    <text x="72" y="398" font-size="18" fill="#35322C">PE 1 km 邻居已装比例 · IN 当月信息量 · AW 环境意识 N(0.5, 0.2) · IRR 代表家庭内部收益率</text>
  </g>

  <g id="stage-evaluation" data-pptx-bounds="72 430 1136 200">
    <text x="72" y="458" font-size="18" font-weight="700" fill="#C0562B">阶段二 · 经济与环境评估（Eq. 3–10）</text>
    <line x1="616" y1="482" x2="616" y2="592" stroke="#16233A" stroke-opacity="0.22" stroke-width="1"/>
    <text x="72" y="510" font-size="24" font-weight="700" fill="#16233A">早期采用者</text>
    <text x="72" y="548" font-size="18" fill="#35322C"><tspan x="72" dy="0">AW &gt; 0.92 且为住宅用户，</tspan><tspan x="72" dy="28">直接安装并跳过经济评估。</tspan></text>
    <text x="644" y="510" font-size="24" font-weight="700" fill="#16233A">其余主体</text>
    <text x="644" y="548" font-size="18" fill="#35322C"><tspan x="644" dy="0">分别计算国内 / 国外组件 NPV，</tspan><tspan x="644" dy="28">取非负且最大者，平局偏好国内。</tspan></text>
    <text x="72" y="618" font-size="16" fill="#35322C" fill-opacity="0.85">国外组件额外承受 1.1% 折现溢价 · 规模效应 SE = 1.1246 · S^−0.051 · NPV 折现 20 年现金流</text>
  </g>

  <g id="page-footer" data-pptx-bounds="72 648 1136 60">
    <line x1="72" y1="660" x2="1208" y2="660" stroke="#16233A" stroke-opacity="0.30" stroke-width="1"/>
    <text x="72" y="690" font-size="16" fill="#35322C" fill-opacity="0.72">权重取自 Table SI 11；实现于 submodels/adoption.py</text>
    <text x="1208" y="690" font-size="16" fill="#35322C" fill-opacity="0.72" text-anchor="end">06 / 14</text>
  </g>

</svg>
