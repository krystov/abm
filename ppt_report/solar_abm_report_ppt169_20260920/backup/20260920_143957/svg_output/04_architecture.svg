<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Segoe UI, system-ui, sans-serif">

  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#16233A"/>
    </marker>
  </defs>

  <rect id="page-bg" data-pptx-role="background"
        x="0" y="0" width="1280" height="720" fill="#F7F5F0"/>

  <g id="page-header" data-pptx-bounds="72 48 1136 132">
    <rect id="motif-bar" x="72" y="58" width="56" height="4" fill="#C0562B"/>
    <text x="72" y="96" font-size="18" fill="#16233A" fill-opacity="0.78">PART 1 · 项目与系统</text>
    <text x="72" y="142" font-size="42" font-weight="700" fill="#16233A">四类角色，每个月走一遍同样的循环</text>
    <line x1="72" y1="168" x2="1208" y2="168" stroke="#16233A" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <g id="architecture-diagram" data-pptx-bounds="72 200 700 440">
    <rect x="72" y="206" width="700" height="56" fill="#EDE8DF"/>
    <text x="92" y="242" font-size="18" fill="#16233A">宏观环境：电价 · FiT · 媒体关注度 · 研发强度 · 全球累计装机</text>
    <line x1="422" y1="262" x2="422" y2="310" stroke="#16233A" stroke-width="2" marker-end="url(#arrow-ink)"/>
    <text x="438" y="292" font-size="16" fill="#35322C" fill-opacity="0.85">外生信号</text>

    <rect x="72" y="322" width="210" height="124" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="1"/>
    <use data-icon="tabler-outline/users" x="92" y="340" width="30" height="30" fill="#C0562B" stroke-width="2"/>
    <text x="92" y="404" font-size="24" font-weight="700" fill="#16233A">采用者 500</text>
    <text x="92" y="430" font-size="16" fill="#35322C" fill-opacity="0.85">住宅 / 工商业 / 电站</text>

    <rect x="317" y="322" width="210" height="124" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="1"/>
    <use data-icon="tabler-outline/route" x="337" y="340" width="30" height="30" fill="#2E6F6A" stroke-width="2"/>
    <text x="337" y="404" font-size="24" font-weight="700" fill="#16233A">安装商 2</text>
    <text x="337" y="430" font-size="16" fill="#35322C" fill-opacity="0.85">国内 / 国外</text>

    <rect x="562" y="322" width="210" height="124" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="1"/>
    <use data-icon="tabler-outline/building-factory" x="582" y="340" width="30" height="30" fill="#16233A" stroke-width="2"/>
    <text x="582" y="404" font-size="24" font-weight="700" fill="#16233A">制造商 2</text>
    <text x="582" y="430" font-size="16" fill="#35322C" fill-opacity="0.85">国内 / 国外</text>

    <line x1="284" y1="384" x2="315" y2="384" stroke="#16233A" stroke-width="2" marker-end="url(#arrow-ink)"/>
    <text x="284" y="372" font-size="14" fill="#35322C" fill-opacity="0.85">新需求</text>
    <line x1="529" y1="384" x2="560" y2="384" stroke="#16233A" stroke-width="2" marker-end="url(#arrow-ink)"/>
    <text x="529" y="372" font-size="14" fill="#35322C" fill-opacity="0.85">订单与价格</text>

    <line x1="667" y1="446" x2="667" y2="492" stroke="#16233A" stroke-opacity="0.55" stroke-width="2"/>
    <line x1="667" y1="492" x2="179" y2="492" stroke="#16233A" stroke-opacity="0.55" stroke-width="2"/>
    <line x1="177" y1="492" x2="177" y2="450" stroke="#16233A" stroke-width="2" marker-end="url(#arrow-ink)"/>
    <text x="300" y="516" font-size="14" fill="#35322C" fill-opacity="0.85">成本与价格反馈回采用者</text>
    <text x="72" y="556" font-size="16" fill="#35322C" fill-opacity="0.85"><tspan x="72" dy="0">国内与国外制造商之间按知识差距比例溢出学习；</tspan><tspan x="72" dy="24">采用决策与实际安装之间隔着安装队列，存在时滞。</tspan></text>
  </g>

  <g id="architecture-facts" data-pptx-bounds="820 200 388 440">
    <use data-icon="tabler-outline/code" x="820" y="206" width="30" height="30" fill="#2E6F6A" stroke-width="2"/>
    <text x="864" y="230" font-size="24" font-weight="700" fill="#16233A">规模与构成</text>
    <text x="820" y="286" font-size="18" fill="#35322C"><tspan x="820" dy="0">采用者按 1:1000 缩比为 500 个，</tspan><tspan x="820" dy="28">构成 住宅 81%、工商业 18.5%、</tspan><tspan x="820" dy="28">电站 0.5%。</tspan></text>
    <text x="820" y="400" font-size="18" fill="#35322C"><tspan x="820" dy="0">系统规模由屋顶面积 × 0.15 kWp/m²</tspan><tspan x="820" dy="28">生成，再按类别的经验区间裁剪。</tspan></text>
    <text x="820" y="486" font-size="18" fill="#35322C"><tspan x="820" dy="0">制造商与安装商各 2 个；截距、β 斜率</tspan><tspan x="820" dy="28">与加成率全部取自论文 SI 参数表。</tspan></text>
    <text x="820" y="572" font-size="18" fill="#35322C"><tspan x="820" dy="0">宏观环境每月给出 5 组外生变量，</tspan><tspan x="820" dy="28">支持合成数据与真实历史数据两模式。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-bounds="72 648 1136 60">
    <line x1="72" y1="660" x2="1208" y2="660" stroke="#16233A" stroke-opacity="0.30" stroke-width="1"/>
    <text x="72" y="690" font-size="16" fill="#35322C" fill-opacity="0.72">代码位置：model/solar_model.py · agents/ · environment/macro_environment.py</text>
    <text x="1208" y="690" font-size="16" fill="#35322C" fill-opacity="0.72" text-anchor="end">04 / 14</text>
  </g>

</svg>
