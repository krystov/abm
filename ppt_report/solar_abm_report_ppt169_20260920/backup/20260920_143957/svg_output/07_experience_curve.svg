    <text x="72" y="398" font-size="18" fill="#35322C"><tspan x="72" dy="0">α 为截距，β 为 log-log 斜率；</tspan><tspan x="72" dy="28">学习率与斜率换算 β = log₂(1 − LR)。</tspan></text>
