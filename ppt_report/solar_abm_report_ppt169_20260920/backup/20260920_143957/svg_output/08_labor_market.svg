<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Segoe UI, system-ui, sans-serif">

  <defs>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2E6F6A"/>
    </marker>
  </defs>

  <rect id="page-bg" data-pptx-role="background"
        x="0" y="0" width="1280" height="720" fill="#F7F5F0"/>

  <g id="page-header" data-pptx-bounds="72 48 1136 132">
    <rect id="motif-bar" x="72" y="58" width="56" height="4" fill="#C0562B"/>
    <text x="72" y="96" font-size="18" fill="#16233A" fill-opacity="0.78">PART 2 · 复现的三个核心机制</text>
    <text x="72" y="142" font-size="42" font-weight="700" fill="#16233A">安装商既是缓冲器，也是降温阀</text>
    <line x1="72" y1="168" x2="1208" y2="168" stroke="#16233A" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <g id="labor-loop" data-pptx-bounds="72 200 620 400">
    <text x="72" y="228" font-size="18" font-weight="700" fill="#2E6F6A">反馈回路</text>
    <rect x="100" y="250" width="280" height="64" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="1"/>
    <text x="124" y="290" font-size="24" font-weight="700" fill="#16233A">订单积压</text>
    <line x1="240" y1="316" x2="240" y2="364" stroke="#2E6F6A" stroke-width="2" marker-end="url(#arrow-loop)"/>
    <text x="256" y="346" font-size="16" fill="#35322C" fill-opacity="0.85">积压超阈值 → 招人</text>
    <rect x="100" y="370" width="280" height="64" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="1"/>
    <text x="124" y="410" font-size="24" font-weight="700" fill="#16233A">用工规模</text>
    <line x1="240" y1="436" x2="240" y2="484" stroke="#2E6F6A" stroke-width="2" marker-end="url(#arrow-loop)"/>
    <text x="256" y="466" font-size="16" fill="#35322C" fill-opacity="0.85">人手不足 → 报价上调</text>
    <rect x="100" y="490" width="280" height="64" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="1"/>
    <text x="124" y="530" font-size="24" font-weight="700" fill="#16233A">BOS 报价</text>
    <line x1="380" y1="522" x2="444" y2="522" stroke="#2E6F6A" stroke-width="2"/>
    <line x1="444" y1="522" x2="444" y2="282" stroke="#2E6F6A" stroke-width="2"/>
    <line x1="444" y1="282" x2="382" y2="282" stroke="#2E6F6A" stroke-width="2" marker-end="url(#arrow-loop)"/>
    <text x="456" y="404" font-size="16" fill="#35322C" fill-opacity="0.85">安装放缓</text>
    <text x="72" y="580" font-size="16" fill="#35322C" fill-opacity="0.85">回路：需求过热 → 用工与报价上升 → 安装放缓，形成自我降温</text>
  </g>

  <g id="labor-points" data-pptx-bounds="720 200 488 400">
    <text x="720" y="250" font-family="Consolas, Microsoft YaHei, monospace" font-size="24" font-weight="700" fill="#C0562B">01</text>
    <text x="768" y="250" font-size="24" font-weight="700" fill="#16233A">订单队列</text>
    <text x="768" y="282" font-size="18" fill="#35322C"><tspan x="768" dy="0">采用决策先进入待安装队列，</tspan><tspan x="768" dy="28">再按安装商产能逐月消化。</tspan></text>
    <text x="768" y="340" font-size="18" fill="#35322C" fill-opacity="0.85">因此"决定装"与"实际装"之间存在时滞。</text>

    <text x="720" y="400" font-family="Consolas, Microsoft YaHei, monospace" font-size="24" font-weight="700" fill="#C0562B">02</text>
    <text x="768" y="400" font-size="24" font-weight="700" fill="#16233A">用工调整</text>
    <text x="768" y="432" font-size="18" fill="#35322C"><tspan x="768" dy="0">积压高于阈值就招人，</tspan><tspan x="768" dy="28">低于阈值就裁员，并设就业下限。</tspan></text>

    <text x="720" y="530" font-family="Consolas, Microsoft YaHei, monospace" font-size="24" font-weight="700" fill="#C0562B">03</text>
    <text x="768" y="530" font-size="24" font-weight="700" fill="#16233A">报价机制</text>
    <text x="768" y="562" font-size="18" fill="#35322C"><tspan x="768" dy="0">非组件成本随积压 / 人手比上升，</tspan><tspan x="768" dy="28">供不应求时安装商提价。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-bounds="72 648 1136 60">
    <line x1="72" y1="660" x2="1208" y2="660" stroke="#16233A" stroke-opacity="0.30" stroke-width="1"/>
    <text x="72" y="690" font-size="16" fill="#35322C" fill-opacity="0.72">非组件成本走单因子经验曲线 β = −0.155（学习率 10.2%）；实现于 submodels/labor_market.py</text>
    <text x="1208" y="690" font-size="16" fill="#35322C" fill-opacity="0.72" text-anchor="end">08 / 14</text>
  </g>

</svg>
