    <path d="M3 21l19 0" />
  </g>
    <text x="112" y="474" font-size="28" font-weight="700" fill="#101828">Manufacturers</text>
    <text font-size="20" fill="#2A2F3A" x="112" y="512">Every month the firm's decision now comes from a board of five</text><text font-size="20" fill="#2A2F3A" x="112" y="538">AI directors with different mandates. They vote, and they leave minutes.</text><g transform="translate(672, 452) scale(1.08333)" fill="none" stroke="#2B5CE6" stroke-width="2">
    <path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
