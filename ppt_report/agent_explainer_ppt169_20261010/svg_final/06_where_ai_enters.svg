  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="page-header" data-pptx-bounds="72 48 1136 132">
    <rect id="motif-bar" x="72" y="58" width="56" height="4" fill="#2B5CE6" />
    <text x="72" y="96" font-size="20" fill="#101828" fill-opacity="0.78">THE RULES · 2 OF 2</text>
    <text x="72" y="142" font-family="Georgia, Cambria, Times New Roman, serif" font-size="48" font-weight="700" fill="#101828">The AI gets one step</text>
    <line x1="72" y1="168" x2="1208" y2="168" stroke="#101828" stroke-opacity="0.22" stroke-width="1" />
  </g>

  <g id="handover-diagram" data-pptx-bounds="108 230 1064 200">
    <rect x="108" y="270" width="300" height="130" fill="#F8FAFC" stroke="#D7DCE5" stroke-width="1" />
    <text x="132" y="316" font-size="20" font-weight="700" fill="#101828">STATE</text>
    <text font-size="20" fill="#2A2F3A" x="132" y="350">prices, knowledge,</text><text font-size="20" fill="#2A2F3A" x="132" y="376">orders, neighbours</text><rect x="490" y="270" width="300" height="130" fill="#EEF2FF" stroke="#2B5CE6" stroke-width="2" />
    <text x="514" y="316" font-size="20" font-weight="700" fill="#2B5CE6">DECISION — REPLACED</text>
    <text font-size="20" fill="#2A2F3A" x="514" y="350">buy or not, expand or not,</text><text font-size="20" fill="#2A2F3A" x="514" y="376">which R&amp;D to fund</text><rect x="872" y="270" width="300" height="130" fill="#F8FAFC" stroke="#D7DCE5" stroke-width="1" />
    <text x="896" y="316" font-size="20" font-weight="700" fill="#101828">UPDATE</text>
    <text font-size="20" fill="#2A2F3A" x="896" y="350">the model applies it and</text><text font-size="20" fill="#2A2F3A" x="896" y="376">advances one month</text><line x1="412" y1="335" x2="484" y2="335" stroke="#101828" stroke-width="2" marker-end="url(#arrow-step)" />
    <line x1="794" y1="335" x2="866" y2="335" stroke="#101828" stroke-width="2" marker-end="url(#arrow-step)" />
  </g>

  <g id="handover-columns" data-pptx-bounds="72 450 1136 150">
    
  <g transform="translate(72, 452) scale(1.08333)" fill="none" stroke="#2B5CE6" stroke-width="2">
    <path d="M4 21c1.147 -4.02 1.983 -8.027 2 -12h6c.017 3.973 .853 7.98 2 12" />
    <path d="M12.5 13h4.5c.025 2.612 .894 5.296 2 8" />
