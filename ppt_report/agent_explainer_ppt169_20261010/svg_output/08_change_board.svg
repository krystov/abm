<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"
     data-pptx-page-role="content"
     font-family="Segoe UI, Arial, sans-serif">

  <rect id="page-bg" data-pptx-role="background"
        x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="72 48 1136 132">
    <rect id="motif-bar" x="72" y="58" width="56" height="4" fill="#2B5CE6"/>
    <text x="72" y="96" font-size="20" fill="#101828" fill-opacity="0.78">WHAT CHANGED · 2 OF 2</text>
    <text x="72" y="142" font-family="Georgia, Cambria, Times New Roman, serif" font-size="48" font-weight="700" fill="#101828">R&amp;D becomes an argument</text>
    <line x1="72" y1="168" x2="1208" y2="168" stroke="#101828" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <g id="board-roster" data-pptx-bounds="72 190 560 410">
    <text x="72" y="216" font-size="28" font-weight="700" fill="#101828">Five directors, five mandates</text>
    <text x="72" y="258" font-size="20" font-weight="700" fill="#2B5CE6">Chair</text>
    <text x="168" y="258" font-size="20" fill="#2A2F3A">long-run strategy and the policy window</text>
    <text x="72" y="324" font-size="20" font-weight="700" fill="#2B5CE6">CFO</text>
    <text x="168" y="324" font-size="20" fill="#2A2F3A">cash, margin and capacity utilisation</text>
    <text x="72" y="390" font-size="20" font-weight="700" fill="#2B5CE6">CTO</text>
    <text x="168" y="390" font-size="20" fill="#2A2F3A">efficiency and the knowledge that cuts cost</text>
    <text x="72" y="456" font-size="20" font-weight="700" fill="#2B5CE6">CMO</text>
    <text x="168" y="456" font-size="20" fill="#2A2F3A">order backlog and market demand</text>
    <text x="72" y="522" font-size="20" font-weight="700" fill="#2B5CE6">CSO</text>
    <text x="168" y="522" font-size="20" fill="#2A2F3A">compliance and supply-chain resilience</text>
  </g>

  <g id="board-vote" data-pptx-bounds="664 190 544 410">
    <text x="664" y="216" font-size="20" font-weight="700" fill="#E4572E">ONE REAL BOARD MEETING</text>
    <text x="664" y="330" font-family="Consolas, Segoe UI, monospace" font-size="72" font-weight="700" fill="#2B5CE6">3 : 1 : 1</text>
    <text x="664" y="372" font-size="20" fill="#2A2F3A">expand · maintain · reduce</text>
    <rect x="664" y="404" width="544" height="150" fill="#F1F3F6"/>
    <text x="692" y="452" font-size="20" fill="#101828"><tspan x="692" dy="0">"The order book is filling and the policy</tspan><tspan x="692" dy="30">window is open: add capacity, and spend</tspan><tspan x="692" dy="30">this month's R&amp;D on cost."</tspan></text>
  </g>

  <g id="board-close" data-pptx-bounds="72 616 1136 40">
    <text x="72" y="642" font-size="20" fill="#101828">The equation always cost-reduced silently. The AI board has to decide it — and can be outvoted.</text>
  </g>

  <g id="page-footer" data-pptx-bounds="72 648 1136 60">
    <line x1="72" y1="660" x2="1208" y2="660" stroke="#101828" stroke-opacity="0.30" stroke-width="1"/>
    <text x="72" y="690" font-size="18" fill="#2A2F3A" fill-opacity="0.75">The board's full minutes — every vote, reason and reservation — are written out after each meeting</text>
    <text x="1208" y="690" font-size="18" fill="#2A2F3A" fill-opacity="0.75" text-anchor="end">08 / 10</text>
  </g>

</svg>
