<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"
     data-pptx-page-role="content"
     font-family="Segoe UI, Arial, sans-serif">

  <rect id="page-bg" data-pptx-role="background"
        x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="72 48 1136 132">
    <rect id="motif-bar" x="72" y="58" width="56" height="4" fill="#2B5CE6"/>
    <text x="72" y="96" font-size="20" fill="#101828" fill-opacity="0.78">THE IDEA · 1 OF 3</text>
    <text x="72" y="142" font-family="Georgia, Cambria, Times New Roman, serif" font-size="48" font-weight="700" fill="#101828">An agent is not an AI</text>
    <line x1="72" y1="168" x2="1208" y2="168" stroke="#101828" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <g id="concept-statement" data-pptx-bounds="72 200 500 400">
    <use data-icon="tabler-outline/users" x="72" y="200" width="30" height="30" fill="#2B5CE6" stroke-width="2"/>
    <text x="72" y="282" font-size="28" fill="#2A2F3A"><tspan x="72" dy="0">An agent is a small stand-in for a</tspan><tspan x="72" dy="40">person or a firm. It has a state —</tspan><tspan x="72" dy="40">what it owns, what it can spend.</tspan><tspan x="72" dy="40">It has a rule: when it buys, when</tspan><tspan x="72" dy="40">it produces. It has neighbours it</tspan><tspan x="72" dy="40">can see.</tspan></text>
    <text x="72" y="560" font-size="28" font-weight="700" fill="#101828">The rules are the theory.</text>
  </g>

  <g id="contrast-block" data-pptx-bounds="620 200 588 400">
    <text x="620" y="238" font-size="20" font-weight="700" fill="#E4572E">SOCIAL-SCIENCE AGENT</text>
    <text x="920" y="238" font-size="20" font-weight="700" fill="#2B5CE6">AI AGENT</text>
    <line x1="620" y1="252" x2="1208" y2="252" stroke="#101828" stroke-opacity="0.22" stroke-width="1"/>

    <text x="620" y="292" font-size="18" fill="#101828" fill-opacity="0.7">What it is</text>
    <text x="620" y="322" font-size="20" fill="#2A2F3A"><tspan x="620" dy="0">a few variables and</tspan><tspan x="620" dy="26">an if-then rule</tspan></text>
    <text x="920" y="322" font-size="20" fill="#2A2F3A"><tspan x="920" dy="0">a learned model with</tspan><tspan x="920" dy="26">a general interface</tspan></text>

    <text x="620" y="400" font-size="18" fill="#101828" fill-opacity="0.7">Where its behaviour comes from</text>
    <text x="620" y="430" font-size="20" fill="#2A2F3A"><tspan x="620" dy="0">written by the researcher,</tspan><tspan x="620" dy="26">inspectable line by line</tspan></text>
    <text x="920" y="430" font-size="20" fill="#2A2F3A"><tspan x="920" dy="0">learned from data,</tspan><tspan x="920" dy="26">not fully inspectable</tspan></text>

    <text x="620" y="508" font-size="18" fill="#101828" fill-opacity="0.7">What it is best at</text>
    <text x="620" y="538" font-size="20" fill="#2A2F3A"><tspan x="620" dy="0">testing a mechanism</tspan><tspan x="620" dy="26">you can state</tspan></text>
    <text x="920" y="538" font-size="20" fill="#2A2F3A"><tspan x="920" dy="0">producing a response</tspan><tspan x="920" dy="26">you cannot pre-state</tspan></text>
  </g>

  <g id="concept-resolution" data-pptx-bounds="72 620 1136 40">
    <text x="72" y="646" font-size="20" fill="#101828">Both are useful, and they answer different questions. This talk puts the second one inside the first.</text>
  </g>

  <g id="page-footer" data-pptx-bounds="72 648 1136 60">
    <line x1="72" y1="660" x2="1208" y2="660" stroke="#101828" stroke-opacity="0.30" stroke-width="1"/>
    <text x="72" y="690" font-size="18" fill="#2A2F3A" fill-opacity="0.75">Agent-based modelling: the researcher writes the rules, the computer runs the population</text>
    <text x="1208" y="690" font-size="18" fill="#2A2F3A" fill-opacity="0.75" text-anchor="end">02 / 10</text>
  </g>

</svg>
