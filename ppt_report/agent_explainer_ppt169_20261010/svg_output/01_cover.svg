    <text x="72" y="662" font-size="18" fill="#2A2F3A" fill-opacity="0.75">Case: agent-based model of Germany's solar PV policy mix, 1991–2016</text>
    <text x="1208" y="662" font-size="18" fill="#2A2F3A" fill-opacity="0.75" text-anchor="end">01 / 10</text>
