<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"
     data-pptx-page-role="content"
     font-family="Segoe UI, Arial, sans-serif">

  <rect id="page-bg" data-pptx-role="background"
        x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="72 48 1136 132">
    <rect id="motif-bar" x="72" y="58" width="56" height="4" fill="#2B5CE6"/>
    <text x="72" y="96" font-size="20" fill="#101828" fill-opacity="0.78">THE CASE · 3 OF 3</text>
    <text x="72" y="142" font-family="Georgia, Cambria, Times New Roman, serif" font-size="48" font-weight="700" fill="#101828">Three kinds of agent</text>
    <line x1="72" y1="168" x2="1208" y2="168" stroke="#101828" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <g id="case-agents" data-pptx-bounds="72 200 420 400">
    <use data-icon="tabler-outline/users" x="72" y="206" width="28" height="28" fill="#2B5CE6" stroke-width="2"/>
    <text x="114" y="230" font-size="28" font-weight="700" fill="#101828">Adopters · 500</text>
    <text x="114" y="260" font-size="20" fill="#2A2F3A">households and firms, 1:1000 scale</text>
    <use data-icon="tabler-outline/building-factory" x="72" y="316" width="28" height="28" fill="#2B5CE6" stroke-width="2"/>
    <text x="114" y="340" font-size="28" font-weight="700" fill="#101828">Manufacturers · 2</text>
    <text x="114" y="370" font-size="20" fill="#2A2F3A">one domestic, one foreign</text>
    <use data-icon="tabler-outline/route" x="72" y="426" width="28" height="28" fill="#2B5CE6" stroke-width="2"/>
    <text x="114" y="450" font-size="28" font-weight="700" fill="#101828">Installers · 2</text>
    <text x="114" y="480" font-size="20" fill="#2A2F3A">order queue and labour market</text>
    <text x="72" y="546" font-size="20" fill="#2A2F3A"><tspan x="72" dy="0">A macro environment supplies the</tspan><tspan x="72" dy="26">monthly price, subsidy and R&amp;D signals.</tspan></text>
  </g>

  <g id="case-figure" data-pptx-bounds="540 200 668 400">
    <image href="../images/results.png" x="574" y="200" width="600" height="400"
           preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="case-caption" data-pptx-bounds="540 612 668 38">
    <text x="540" y="638" font-size="18" fill="#2A2F3A" fill-opacity="0.75">Baseline: formula-only run, 312 ticks, seed 42, synthetic data</text>
  </g>

  <g id="page-footer" data-pptx-bounds="72 648 1136 60">
    <line x1="72" y1="660" x2="1208" y2="660" stroke="#101828" stroke-opacity="0.30" stroke-width="1"/>
    <text x="72" y="690" font-size="18" fill="#2A2F3A" fill-opacity="0.75">One tick is one month: macro signals, then adopters, installers, manufacturers, then the clock</text>
    <text x="1208" y="690" font-size="18" fill="#2A2F3A" fill-opacity="0.75" text-anchor="end">04 / 10</text>
  </g>

</svg>
